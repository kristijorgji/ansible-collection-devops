---
# Public tasks_from: certificates — issue missing lineages and deploy renewal hooks.

- name: Resolve certificate domain list
  ansible.builtin.set_fact:
    certbot_domains_effective: >-
      {{
        (
          certbot_domains
          if (certbot_domains | length > 0)
          else (
            ([certbot_apex_domain] if certbot_apex_domain | length > 0 else [])
            + (
                [certbot_www_domain]
                if (certbot_include_www | bool and certbot_www_domain | length > 0)
                else []
              )
            + (certbot_extra_domains | default([]))
          )
        ) | unique | list
      }}

- name: Fail when issuing without an admin email
  ansible.builtin.fail:
    msg: certbot_admin_email is required when certbot_issue is true.
  when:
    - certbot_issue | bool
    - certbot_admin_email | length == 0

- name: Fail when issuing without domains
  ansible.builtin.fail:
    msg: Set certbot_domains or certbot_apex_domain when certbot_issue is true.
  when:
    - certbot_issue | bool
    - certbot_domains_effective | length == 0

- name: Check existing Let's Encrypt certificates
  ansible.builtin.stat:
    path: "{{ certbot_live_dir }}/{{ item }}"
  loop: "{{ certbot_domains_effective }}"
  register: certbot_cert_stats
  when: certbot_issue | bool

- name: Build certbot extra arguments
  ansible.builtin.set_fact:
    certbot_args_effective: >-
      {{
        (
          ['--standalone', '--preferred-challenges', certbot_preferred_challenges]
          if certbot_challenge == 'standalone'
          else []
        )
        + (
          ['--webroot', '-w', certbot_webroot_path, '--preferred-challenges', certbot_preferred_challenges]
          if certbot_challenge == 'webroot'
          else []
        )
        + (['--staging'] if certbot_staging | bool else [])
        + (['--server', certbot_server] if certbot_server | length > 0 else [])
        + (['--key-type', certbot_key_type] if certbot_key_type | length > 0 else [])
        + (['--staple-ocsp'] if certbot_staple_ocsp | bool else [])
        + (certbot_extra_args | default([]))
      }}
  when: certbot_issue | bool

- name: Call certbot to create missing certificates
  ansible.builtin.script: >-
    {{ role_path }}/files/create-certificates.sh
    {{ certbot_domains_effective | join(' ') }}
  environment:
    CERTBOT_ADMIN_EMAIL: "{{ certbot_admin_email }}"
    PRE_HOOK: "{{ certbot_pre_hook | default('') }}"
    POST_HOOK: "{{ certbot_post_hook | default('') }}"
    LETSENCRYPT_PATH: "{{ certbot_live_dir }}"
    CERTBOT_ARGS: "{{ certbot_args_effective | join(' ') }}"
  register: certbot_issue_result
  become: true
  when:
    - certbot_issue | bool
    - certbot_cert_stats.results | rejectattr('stat.exists') | list | length > 0
  changed_when: "'Successfully received certificate' in (certbot_issue_result.stdout | default(''))"
  failed_when: certbot_issue_result.rc != 0

- name: Ensure Let's Encrypt renewal hook directories exist
  ansible.builtin.file:
    path: "/etc/letsencrypt/renewal-hooks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - pre
    - deploy
    - post

- name: Resolve renewal hook list
  ansible.builtin.set_fact:
    certbot_renewal_hooks_effective: "{{ certbot_renewal_hooks_resolved }}"
  vars:
    certbot_renewal_hooks_resolved: >-
      {{
        certbot_renewal_hooks
        if (certbot_renewal_hooks | length > 0)
        else (
          [
            {
              'stage': 'pre',
              'dest_name': certbot_renewal_hook_name ~ '.sh',
              'src': certbot_renewal_hooks_dir ~ '/pre.sh',
              'template': certbot_renewal_hooks_template | bool
            },
            {
              'stage': 'deploy',
              'dest_name': certbot_renewal_hook_name ~ '.sh',
              'src': certbot_renewal_hooks_dir ~ '/deploy.sh',
              'template': certbot_renewal_hooks_template | bool
            },
            {
              'stage': 'post',
              'dest_name': certbot_renewal_hook_name ~ '.sh',
              'src': certbot_renewal_hooks_dir ~ '/post.sh',
              'template': certbot_renewal_hooks_template | bool
            }
          ]
          if (certbot_renewal_hooks_dir | length > 0 and certbot_renewal_hook_name | length > 0)
          else []
        )
      }}

- name: Copy Certbot renewal hooks
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/letsencrypt/renewal-hooks/{{ item.stage }}/{{ item.dest_name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ certbot_renewal_hooks_effective | default([]) }}"
  when:
    - item.src is defined
    - not (item.template | default(false) | bool)
    - item.content is not defined

- name: Template Certbot renewal hooks
  ansible.builtin.template:
    src: "{{ item.src }}{{ '' if item.src.endswith('.j2') else '.j2' }}"
    dest: "/etc/letsencrypt/renewal-hooks/{{ item.stage }}/{{ item.dest_name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ certbot_renewal_hooks_effective | default([]) }}"
  when:
    - item.src is defined
    - item.template | default(false) | bool
    - item.content is not defined

- name: Write Certbot renewal hook content
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/letsencrypt/renewal-hooks/{{ item.stage }}/{{ item.dest_name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ certbot_renewal_hooks_effective | default([]) }}"
  when: item.content is defined

- name: Configure Certbot renew cron
  ansible.builtin.include_tasks: _renew_cron.yml
  when: certbot_renew_cron | bool

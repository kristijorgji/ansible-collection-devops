---
# Native nvm + package-manager install (optional) and optional node_command.
# Prefer tasks_from: pnpm_nvm_exec (sets node_package_manager: pnpm) from consumers.
# Requires: projectName, codePath, delegate_build_to_host, node_package_manager

- ansible.builtin.import_tasks: pm_resolve.yml

- name: "{{ projectName }} - native: {{ node_package_manager }} install at {{ codePath }}"
  ansible.builtin.shell: |
    set -e
    unset NPM_CONFIG_PREFIX
    export CI=1
    # shellcheck source=/dev/null
    . "{{ role_path }}/files/nvm_init.sh"
    nvm install {{ node_version }}
    nvm use {{ node_version }}
    {{ node_pm_cfg.activate_shell }}
    {{ node_pm_cross_platform_shell | default('') }}
    cd "{{ codePath }}"
    {{ node_package_manager }} {{ node_pm_install_args_effective }}
  args:
    executable: /bin/bash
  environment:
    CI: "1"
    NODE_AUTH_TOKEN: "{{ github_packages_token | default('') }}"
  no_log: "{{ (github_packages_token | default('')) | length > 0 }}"
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ node_become_effective }}"
  register: node_nvm_install_result
  failed_when: false
  changed_when: node_nvm_install_result.rc == 0
  when: node_run_install | default(true) | bool

- name: "{{ projectName }} - native: {{ node_package_manager }} install failed"
  ansible.builtin.fail:
    msg: |
      {{ projectName }} {{ node_package_manager }} install failed (rc={{ node_nvm_install_result.rc }})
      cwd: {{ codePath }}

      --- stdout ---
      {{ node_nvm_install_result.stdout | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}

      --- stderr ---
      {{ node_nvm_install_result.stderr | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}
  when:
    - node_run_install | default(true) | bool
    - node_nvm_install_result.rc | default(0) != 0

- name: "{{ projectName }} - native: {{ node_command | default('') }} at {{ codePath }}"
  ansible.builtin.shell: |
    set -e
    unset NPM_CONFIG_PREFIX
    export CI=1
    # shellcheck source=/dev/null
    . "{{ role_path }}/files/nvm_init.sh"
    nvm install {{ node_version }}
    nvm use {{ node_version }}
    {{ node_pm_cfg.activate_shell }}
    {{ node_pm_cross_platform_shell | default('') }}
    cd "{{ codePath }}"
    {{ node_command }}
  args:
    executable: /bin/bash
  environment:
    CI: "1"
    NODE_AUTH_TOKEN: "{{ github_packages_token | default('') }}"
  no_log: "{{ (github_packages_token | default('')) | length > 0 }}"
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ node_become_effective }}"
  register: node_nvm_command_result
  failed_when: false
  changed_when: node_nvm_command_result.rc == 0
  when:
    - node_command is defined
    - node_command | length > 0

- name: "{{ projectName }} - native: command failed"
  ansible.builtin.fail:
    msg: |
      {{ projectName }} command failed (rc={{ node_nvm_command_result.rc }})
      command: {{ node_command }}
      cwd: {{ codePath }}

      --- stdout ---
      {{ node_nvm_command_result.stdout | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}

      --- stderr ---
      {{ node_nvm_command_result.stderr | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}
  when:
    - node_command is defined
    - node_command | length > 0
    - node_nvm_command_result.rc | default(0) != 0

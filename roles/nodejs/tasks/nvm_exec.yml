---
# Native nvm + pnpm install (optional) and optional pnpm_nvm_command.
# Requires: projectName, codePath, delegate_build_to_host
# Optional: pnpm_node_version, pnpm_builder_version, pnpm_run_install,
#   pnpm_nvm_command, pnpm_nvm_install_args, pnpm_nvm_apply_cross_platform,
#   docker_target_platform, github_packages_token, become_in_build_machine

- name: "{{ projectName }} - nvm pnpm install at {{ codePath }}"
  ansible.builtin.shell: |
    set -e
    unset NPM_CONFIG_PREFIX
    export CI=1
    # shellcheck source=/dev/null
    . "{{ role_path }}/files/nvm_init.sh"
    nvm install {{ pnpm_node_version }}
    nvm use {{ pnpm_node_version }}
    corepack enable
    corepack prepare pnpm@{{ pnpm_builder_version }} --activate
    {{ pnpm_nvm_cross_platform_shell | default('') }}
    cd "{{ codePath }}"
    pnpm install --frozen-lockfile --prefer-offline {{ pnpm_nvm_install_args | default('') }}
  vars:
    pnpm_nvm_cross_platform_shell: >-
      {{
        'eval "$(bash "' + role_path + '/files/npm_cross_platform_env.sh" "' + (docker_target_platform | default('linux/amd64')) + '")"'
        if pnpm_nvm_apply_cross_platform | default(false) | bool
        else ''
      }}
  args:
    executable: /bin/bash
  environment:
    CI: "1"
    NODE_AUTH_TOKEN: "{{ github_packages_token | default('') }}"
  no_log: "{{ (github_packages_token | default('')) | length > 0 }}"
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ become_in_build_machine | default(false) }}"
  register: pnpm_nvm_install_result
  failed_when: false
  changed_when: pnpm_nvm_install_result.rc == 0
  when: pnpm_run_install | default(true) | bool

- name: "{{ projectName }} - nvm pnpm install failed"
  ansible.builtin.fail:
    msg: |
      {{ projectName }} pnpm install failed (rc={{ pnpm_nvm_install_result.rc }})
      cwd: {{ codePath }}

      --- stdout ---
      {{ pnpm_nvm_install_result.stdout | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}

      --- stderr ---
      {{ pnpm_nvm_install_result.stderr | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}
  when:
    - pnpm_run_install | default(true) | bool
    - pnpm_nvm_install_result.rc | default(0) != 0

- name: "{{ projectName }} - nvm pnpm command {{ pnpm_nvm_command | default('') }} at {{ codePath }}"
  ansible.builtin.shell: |
    set -e
    unset NPM_CONFIG_PREFIX
    export CI=1
    # shellcheck source=/dev/null
    . "{{ role_path }}/files/nvm_init.sh"
    nvm install {{ pnpm_node_version }}
    nvm use {{ pnpm_node_version }}
    corepack enable
    corepack prepare pnpm@{{ pnpm_builder_version }} --activate
    {{ pnpm_nvm_cross_platform_shell | default('') }}
    cd "{{ codePath }}"
    {{ pnpm_nvm_command }}
  vars:
    pnpm_nvm_cross_platform_shell: >-
      {{
        'eval "$(bash "' + role_path + '/files/npm_cross_platform_env.sh" "' + (docker_target_platform | default('linux/amd64')) + '")"'
        if pnpm_nvm_apply_cross_platform | default(false) | bool
        else ''
      }}
  args:
    executable: /bin/bash
  environment:
    CI: "1"
    NODE_AUTH_TOKEN: "{{ github_packages_token | default('') }}"
  no_log: "{{ (github_packages_token | default('')) | length > 0 }}"
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ become_in_build_machine | default(false) }}"
  register: pnpm_nvm_command_result
  failed_when: false
  changed_when: pnpm_nvm_command_result.rc == 0
  when:
    - pnpm_nvm_command is defined
    - pnpm_nvm_command | length > 0

- name: "{{ projectName }} - nvm pnpm command failed"
  ansible.builtin.fail:
    msg: |
      {{ projectName }} pnpm command failed (rc={{ pnpm_nvm_command_result.rc }})
      command: {{ pnpm_nvm_command }}
      cwd: {{ codePath }}

      --- stdout ---
      {{ pnpm_nvm_command_result.stdout | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}

      --- stderr ---
      {{ pnpm_nvm_command_result.stderr | default('') | regex_replace('\x1b\\[[0-9;]*m', '') }}
  when:
    - pnpm_nvm_command is defined
    - pnpm_nvm_command | length > 0
    - pnpm_nvm_command_result.rc | default(0) != 0

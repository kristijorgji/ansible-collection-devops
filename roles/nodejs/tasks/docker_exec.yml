---
# Dockerized arbitrary node command (e.g. pnpm build / yarn build).
# Prefer tasks_from: pnpm_docker_exec from consumers.
# Requires: projectName, codePath, dockerBuilderImage, node_command, delegate_build_to_host
# Optional: node_docker_extra_volume_flags

- ansible.builtin.import_tasks: pm_resolve.yml

- name: "{{ projectName }} - docker: exec: {{ node_command }}"
  ansible.builtin.shell: >-
    docker container run --rm --entrypoint='' -u root
    --platform {{ docker_target_platform | default('linux/amd64') }}
    -v {{ codePath }}:/usr/src/app
    {{ node_docker_extra_volume_flags | default('') }}
    -v {{ node_pm_host_cache_dir }}:{{ node_pm_cfg.container_cache_dir }}
    {{ node_pm_docker_cache_env_args }}
    -e NODE_AUTH_TOKEN
    -w /usr/src/app
    {{ dockerBuilderImage }}
    {{ node_command }}
  environment:
    NODE_AUTH_TOKEN: "{{ github_packages_token | default('') }}"
  no_log: "{{ (github_packages_token | default('')) | length > 0 }}"
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ become_in_build_machine | default(false) }}"
  when:
    - node_command is defined
    - node_command | length > 0

---
# Build a local Docker image with Node + package manager preinstalled.
# Prefer tasks_from: pnpm_ensure_builder_image from consumers.
# Requires: dockerBuilderImage, node_version, delegate_build_to_host, node_package_manager

- ansible.builtin.import_tasks: pm_resolve.yml

- name: "{{ projectName | default('nodejs') }} - docker: check if builder image {{ dockerBuilderImage }} exists"
  ansible.builtin.command: docker image inspect {{ dockerBuilderImage }}
  register: node_builder_image_inspect
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ node_become_effective }}"
  changed_when: false
  failed_when: false
  run_once: "{{ node_ensure_builder_run_once | default(true) | bool }}"

- name: "{{ projectName | default('nodejs') }} - docker: ensure builder image {{ dockerBuilderImage }} exists"
  ansible.builtin.shell: |
    echo "FROM node:{{ node_version }}-slim
    {{ node_pm_cfg.dockerfile_run }}" | docker build --platform {{ docker_target_platform | default('linux/amd64') }} -t {{ dockerBuilderImage }} -
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ node_become_effective }}"
  when: node_builder_image_inspect.rc != 0
  run_once: "{{ node_ensure_builder_run_once | default(true) | bool }}"

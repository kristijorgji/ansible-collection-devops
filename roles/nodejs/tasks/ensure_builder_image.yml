---
# Build a local Docker image with Node + pnpm preinstalled (skips corepack each run).
# Requires: dockerBuilderImage, pnpm_node_version, pnpm_builder_version, delegate_build_to_host

- name: "check if pnpm builder image {{ dockerBuilderImage }} exists"
  ansible.builtin.command: docker image inspect {{ dockerBuilderImage }}
  register: pnpm_builder_image_inspect
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ become_in_build_machine | default(false) }}"
  changed_when: false
  failed_when: false
  run_once: "{{ pnpm_ensure_builder_run_once | default(true) | bool }}"

- name: "ensure pnpm builder image {{ dockerBuilderImage }} exists"
  ansible.builtin.shell: |
    echo "FROM node:{{ pnpm_node_version }}-slim
    RUN corepack enable && corepack prepare pnpm@{{ pnpm_builder_version }} --activate" | docker build --platform {{ docker_target_platform | default('linux/amd64') }} -t {{ dockerBuilderImage }} -
  delegate_to: "{{ delegate_build_to_host }}"
  become: "{{ become_in_build_machine | default(false) }}"
  when: pnpm_builder_image_inspect.rc != 0
  run_once: "{{ pnpm_ensure_builder_run_once | default(true) | bool }}"

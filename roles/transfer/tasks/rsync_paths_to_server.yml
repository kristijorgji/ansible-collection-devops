---
# Sync a monorepo checkout from a local build host to serverCodePath (partial tree merge).
# Prefer tasks_from: rsync_paths_to_server from consumers.
# Requires: projectName, monorepo_local_code_path, serverCodePath
# Single tree: monorepo_sync_src (path relative to repo root)
# Multi tree: monorepo_sync_paths (list of paths relative to repo root)
# Optional: monorepo_deploy_marker_path (directory for .ansible-deploy-commit)

- name: "{{ projectName }} - resolve monorepo sync paths"  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    monorepo_sync_archive_paths: >-
      {{
        monorepo_sync_paths
        if monorepo_sync_paths is defined
        else [monorepo_sync_src]
      }}

- name: "{{ projectName }} - stat monorepo sync paths on the controller"  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ monorepo_local_code_path }}/{{ item | regex_replace('/+$', '') }}"
  loop: "{{ monorepo_sync_archive_paths }}"
  delegate_to: localhost
  become: false
  register: monorepo_sync_path_stats

# A directory src without a trailing slash nests into an existing dest
# (apps/backend/backend) and leaves the real package.json stale, so
# pnpm --frozen-lockfile fails. Append the slash only when the path is a directory.
# synchronize runs on the control node — do not inherit play become (sudo on localhost).
- name: "{{ projectName }} - rsync partial paths to server"
  become: false
  ansible.posix.synchronize:
    src: "{{ monorepo_local_code_path }}/{{ item.item | regex_replace('/+$', '') }}{{ '/' if item.stat.isdir | default(false) else '' }}"
    dest: "{{ serverCodePath }}/{{ item.item | regex_replace('/+$', '') }}{{ '/' if item.stat.isdir | default(false) else '' }}"
    mode: push
    delete: true
    recursive: true
    rsync_opts: "{{ monorepo_sync_rsync_opts | default(['--exclude=.env', '--exclude=.env.*']) }}"
  loop: "{{ monorepo_sync_path_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "{{ projectName }} - ensure server code path {{ serverCodePath }} is owned by app user"
  become: true
  ansible.builtin.file:
    path: "{{ serverCodePath }}"
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "{{ projectName }} - write deploy commit marker"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../deploy/tasks/write_marker.yml"
  vars:
    deploy_commit_marker_dir: "{{ monorepo_deploy_marker_path | default(serverCodePath) }}"

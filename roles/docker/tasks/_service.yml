---
# Private: docker group + engine service. daemon.json when effective options are non-empty.
# After replacing docker.io, docker.socket can be in start-limit; reset then start the socket
# before dockerd (-H fd:// requires socket activation).

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_daemon_effective | length > 0

- name: Slurp existing Docker daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_existing
  failed_when: false
  when: docker_daemon_effective | length > 0

- name: Write Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ docker_daemon_effective | to_nice_json }}\n"
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: Restart docker
  when:
    - docker_daemon_effective | length > 0
    - docker_daemon_needs_write | bool
  vars:
    docker_daemon_existing_obj: >-
      {{
        (docker_daemon_existing.content | b64decode | from_json)
        if (docker_daemon_existing.content is defined)
        else {}
      }}
    docker_daemon_needs_write: "{{ docker_daemon_existing_obj != docker_daemon_effective }}"

- name: Reload systemd after Docker package changes
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reset failed Docker systemd units
  ansible.builtin.command: systemctl reset-failed docker.socket docker.service
  changed_when: false
  failed_when: false

- name: Enable and start docker.socket
  ansible.builtin.systemd:
    name: docker.socket
    state: started
    enabled: true
  failed_when: false

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"

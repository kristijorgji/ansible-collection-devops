---
# Private: engine packages (CE or distro). May restart the engine when replacing docker.io.

- name: Remove distro packages that conflict with Docker CE
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent
  when:
    - docker_install_source == "ce"
    - docker_remove_conflicts | bool

- name: Read installed docker-ce version
  ansible.builtin.command: dpkg-query -W -f=${Version} docker-ce
  register: docker_ce_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - docker_install_source == "ce"
    - docker_engine_version | length > 0

- name: Unhold docker-ce before a version change
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - docker-ce
    - docker-ce-cli
  failed_when: false
  when:
    - docker_install_source == "ce"
    - docker_engine_version | length > 0
    - docker_engine_version not in (docker_ce_installed.stdout | default(''))

- name: Build Docker CE package list
  ansible.builtin.set_fact:
    docker_ce_packages: "{{ docker_ce_base + docker_ce_buildx + docker_ce_compose + docker_extra_packages }}"
  when: docker_install_source == "ce"
  vars:
    docker_ce_base:
      - "{{ 'docker-ce=' + docker_engine_version if docker_engine_version | length > 0 else 'docker-ce' }}"
      - "{{ 'docker-ce-cli=' + docker_engine_version if docker_engine_version | length > 0 else 'docker-ce-cli' }}"
      - containerd.io
    docker_ce_buildx: "{{ ['docker-buildx-plugin'] if docker_install_buildx | bool else [] }}"
    docker_ce_compose: >-
      {{
        [
          'docker-compose-plugin=' + docker_compose_plugin_version
          if docker_compose_plugin_version | length > 0 else 'docker-compose-plugin'
        ]
        if docker_want_compose_plugin | bool else []
      }}

- name: Install Docker CE packages
  ansible.builtin.apt:
    name: "{{ docker_ce_packages }}"
    state: "{{ docker_packages_state }}"
    update_cache: true
    allow_change_held_packages: true
  when: docker_install_source == "ce"

- name: Hold pinned Docker CE packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
  when:
    - docker_install_source == "ce"
    - docker_engine_version | length > 0

- name: Hold pinned Compose plugin package
  ansible.builtin.dpkg_selections:
    name: docker-compose-plugin
    selection: hold
  when:
    - docker_install_source == "ce"
    - docker_want_compose_plugin | bool
    - docker_compose_plugin_version | length > 0

- name: Install distro Docker packages
  ansible.builtin.apt:
    name: "{{ ['docker.io'] + (['docker-buildx'] if docker_install_buildx | bool else []) + docker_extra_packages }}"
    state: "{{ docker_packages_state }}"
    update_cache: true
  when: docker_install_source == "distro"

- name: Install Python Docker SDK from apt
  ansible.builtin.apt:
    name: python3-docker
    state: present
  when: docker_python_sdk == "apt"

- name: Install pip for the Python Docker SDK
  ansible.builtin.apt:
    name: python3-pip
    state: present
  when: docker_python_sdk == "pip"

- name: Install Python Docker SDK from pip
  ansible.builtin.pip:
    name: docker
    version: "{{ docker_python_sdk_pip_version if docker_python_sdk_pip_version | length > 0 else omit }}"
    break_system_packages: "{{ ansible_distribution_version is version('23.04', '>=') or (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 12) }}"
  when: docker_python_sdk == "pip"

---
# Defaults for kristijorgji.devops.docker (override per play / include_role vars).
# Does not set docker_images or docker_target_platform (those belong to consumers).

docker_install_source: ce
docker_packages_state: present
docker_engine_version: ""
docker_install_buildx: true
docker_remove_conflicts: true
docker_apt_channel: stable
docker_apt_arch: ""
docker_repo_url: https://download.docker.com/linux
docker_repo_key_refresh: false
docker_repo_remove_legacy_list: true
docker_service_state: started
docker_service_enabled: true
docker_users: []
docker_daemon_options: {}
docker_daemon_log_rotation: true
docker_daemon_log_driver: json-file
docker_daemon_log_max_size: "10m"
docker_daemon_log_max_file: "5"
docker_compose_install: both
docker_compose_plugin_version: ""
docker_compose_standalone_version: latest
docker_compose_standalone_path: /usr/local/bin/docker-compose
docker_compose_standalone_update: false
docker_skip: false
docker_extra_packages: []
docker_python_sdk: none
docker_python_sdk_pip_version: ""
docker_iptables_backend: ""

---
# Load host/group SOPS secrets from environments/*/secrets/ (not project vars).
#
# Scans environments/common/secrets/ and environments/<env>/secrets/ for *.sops.yml,
# then loads each file via community.sops.load_vars when the current host matches:
#   - path contains /secrets/<group>/ for a non-"all" group in group_names, or
#   - path is a direct child of secrets/all/ (e.g. ssm.sops.yml — every host is in all)
#
# NOT for project secrets (projects/*/vars/*.sops.yml) — use the consumer's project-vars loader.
# Never place *.sops.yml under group_vars/ or host_vars/ (host_group_vars loads ciphertext).
#
# Prefer tasks_from: load_secrets from consumers (pre_tasks with tags: always).
# Requires: environments_dir, env, sops_age_key_file, sops_config_path.
# Uses return_method: vars-only so values are host vars (ansible-core 2.19+ / 2.21+ safe).
# stat/find delegate to localhost with become: false (play-level become must not sudo on controller).

- name: Check secrets directories for SOPS files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ environments_dir }}/common/secrets"
    - "{{ environments_dir }}/{{ env }}/secrets"
  register: _sops_path_stats
  delegate_to: localhost
  become: false
  run_once: true

- name: Find SOPS secret files under secrets
  ansible.builtin.find:
    paths: "{{ _sops_path_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}"
    patterns: "*.sops.yml"
    recurse: true
  register: _sops_secret_files
  delegate_to: localhost
  become: false
  run_once: true
  when: _sops_path_stats.results | selectattr('stat.exists') | list | length > 0

- name: Load SOPS secrets for this host
  community.sops.load_vars:
    file: "{{ item.path }}"
    age_keyfile: "{{ sops_age_key_file }}"
    return_method: vars-only
  environment:
    SOPS_CONFIG_PATH: "{{ sops_config_path }}"
  loop: "{{ _sops_secret_files.files | default([]) }}"
  vars:
    _non_all_groups: "{{ group_names | reject('equalto', 'all') | list }}"
    _matches_host_group: >-
      {{
        _non_all_groups | length > 0
        and item.path is search('/secrets/(' + (_non_all_groups | join('|')) + ')/')
      }}
    _matches_all_direct: "{{ item.path is search('/secrets/all/[^/]+\\.sops\\.yml$') }}"
  when: _matches_host_group or _matches_all_direct
  no_log: true

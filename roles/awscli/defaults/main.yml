---
# Defaults for kristijorgji.devops.awscli.
# Empty awscli_version installs the current bundle only when `aws --version`
# does not run successfully. A wrong-arch or otherwise unusable binary is
# treated as missing.

awscli_skip: false
awscli_version: ""
awscli_install_dir: /usr/local/aws-cli
awscli_bin_dir: /usr/local/bin
awscli_tmp_dir: /tmp

---
# Defaults for kristijorgji.devops.logrotate.

logrotate_conf_dir: /etc/logrotate.d
logrotate_defaults:
  frequency: daily
  rotate: 14
  compress: true
  delaycompress: true
  missingok: true
  notifempty: true
  # Ubuntu /var/log is group-writable (syslog:adm). Without su, logrotate
  # skips files whose parent is not exclusively root-owned.
  su: root root
logrotate_entries: []

---
# Public tasks_from: install — package plus one file per logrotate_entries item.

- name: Install logrotate package
  ansible.builtin.apt:
    name: logrotate
    state: present
    update_cache: true

- name: Deploy logrotate entries
  ansible.builtin.template:
    src: entry.j2
    dest: "{{ logrotate_conf_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    validate: "sh -c '! /usr/sbin/logrotate -d \"$1\" 2>&1 | grep -q \"^error\"' _ %s"
  loop: "{{ logrotate_entries }}"
  loop_control:
    loop_var: item
    label: "{{ item.name }}"
  vars:
    logrotate_entry: "{{ item }}"
    logrotate_entry_options: "{{ logrotate_defaults | combine(item.options | default({})) }}"
  when: (item.state | default('present')) != 'absent'

- name: Remove logrotate entries
  ansible.builtin.file:
    path: "{{ logrotate_conf_dir }}/{{ item.name }}"
    state: absent
  loop: "{{ logrotate_entries }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.state | default('present')) == 'absent'

---
- name: Verify kristijorgji.devops.compose_watchdog
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: List running containers
      ansible.builtin.command: docker ps --format '{% raw %}{{.Names}}{% endraw %}'
      register: watchdog_ps
      changed_when: false

    - name: Slurp watchdog logs
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /var/log/docker-watchdog/watchdog-yml.log
        - /var/log/docker-watchdog/watchdog-yaml.log
        - /var/log/docker-watchdog/hooks.log
      register: watchdog_logs

    - name: Read root crontab
      ansible.builtin.command: crontab -l
      register: watchdog_crontab
      changed_when: false
      failed_when: false

    - name: Stat watchdog script after absent
      ansible.builtin.stat:
        path: /usr/local/bin/docker-compose-up.sh
      register: watchdog_script

    - name: Assert stacks ran, hooks logged, and absent removed the unit
      ansible.builtin.assert:
        that:
          - watchdog_ps.stdout_lines | length >= 2
          - "'exit=0' in (watchdog_logs.results[0].content | b64decode)"
          - "'exit=0' in (watchdog_logs.results[1].content | b64decode)"
          - "'hooked' in (watchdog_logs.results[2].content | b64decode)"
          - "'Ansible: docker-compose up (watchdog)' not in (watchdog_crontab.stdout | default(''))"
          - not watchdog_script.stat.exists

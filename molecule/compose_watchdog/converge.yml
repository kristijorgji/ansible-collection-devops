---
- name: Converge kristijorgji.devops.compose_watchdog
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install Docker for watchdog stacks
      ansible.builtin.include_role:
        name: kristijorgji.devops.docker
        tasks_from: install
      vars:
        docker_compose_install: plugin
        docker_daemon_log_rotation: false

    - name: Create compose stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/watchdog-yml
        - /opt/watchdog-yaml

    - name: Write docker-compose.yml stack
      ansible.builtin.copy:
        dest: /opt/watchdog-yml/docker-compose.yml
        mode: "0644"
        content: |
          services:
            sleeper:
              image: busybox:1.36
              command: ["sleep", "3600"]

    - name: Write compose.yaml stack
      ansible.builtin.copy:
        dest: /opt/watchdog-yaml/compose.yaml
        mode: "0644"
        content: |
          services:
            sleeper:
              image: busybox:1.36
              command: ["sleep", "3600"]

    - name: Install compose watchdog
      ansible.builtin.include_role:
        name: kristijorgji.devops.compose_watchdog
        tasks_from: install
      vars:
        compose_watchdog_paths:
          - /opt/watchdog-yml
          - /opt/watchdog-yaml
        compose_watchdog_compose_command: docker compose
        compose_watchdog_up_timeout: 60

    - name: Install watchdog hook
      ansible.builtin.copy:
        dest: /etc/docker-watchdog.d/marker.sh
        mode: "0755"
        content: |
          #!/bin/sh
          echo hooked >> "${WATCHDOG_LOG_DIR}/hooks.log"

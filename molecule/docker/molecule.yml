---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml
driver:
  name: docker
platforms:
  - name: ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
  - name: ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
  - name: debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
  - name: debian13
    image: geerlingguy/docker-debian13-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections
  config_options:
    defaults:
      interpreter_python: auto_silent
      host_key_checking: false
      retry_files_enabled: false
  inventory:
    host_vars:
      ubuntu2204:
        docker_engine_version: "29.9.2"
        docker_compose_standalone_version: v5.6.1
        docker_python_sdk: apt
        docker_iptables_backend: legacy
      ubuntu2404:
        docker_engine_version: "29.9.2"
        docker_compose_standalone_version: v5.6.1
        docker_python_sdk: apt
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
verifier:
  name: ansible
